<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR MASTER</title>
  <link rel="stylesheet" href="style.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="wrapper">
    
    <!-- Pestaña principal -->
    <div class="system-tabs">
      <button class="tab-btn active" data-tab="generator">Generador</button>
      <button class="tab-btn" data-tab="decoder">Decodificador</button>
    </div>

    <!-- SECCIÓN 1: GENERADOR -->
    <div class="tab-content active" id="generator-section">
      <div class="panel-left">
        <header>
          <h2>QR MASTER</h2>
          <p>Empieza a experimentar</p>
        </header>

        <div class="form">
          <div class="input-group">
            <label>Texto o URL:</label>
            <input type="text" class="qr-text" spellcheck="false" placeholder="Ingresa tu URL o texto aquí...">
          </div>

          <div class="form-row">
            <div class="input-group">
              <label>Tamaño:</label>
              <select class="qr-size">
                <option value="150x150">150 x 150 px</option>
                <option value="200x200" selected>200 x 200 px</option>
                <option value="300x300">300 x 300 px</option>
                <option value="400x400">400 x 400 px</option>
              </select>
            </div>

            <div class="input-group">
              <label>Formato:</label>
              <select class="qr-format">
                <option value="png" selected>PNG</option>
                <option value="svg">SVG</option>
                <option value="eps">EPS</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="input-group">
              <label>Elegir color de texto:</label>
              <div class="color-box">
                <input type="color" class="qr-color" value="#0d0d0d">
              </div>
            </div>
            <div class="input-group">
              <label>Elegir color de fondo:</label>
              <div class="color-box">
                <input type="color" class="qr-bgcolor" value="#ffffff">
              </div>
            </div>
          </div>

          <div class="input-group">
            <label>Zona de protección:</label>
            <select class="qr-qzone">
              <option value="0">0 (ninguna)</option>
              <option value="2">2</option>
              <option value="4" selected>4 (recomendada)</option>
              <option value="6">6</option>
              <option value="8">8</option>
            </select>
          </div>

          <div class="contrast-warning" id="contrastWarning">
            <span><strong>Cuidado: Bajo contraste.</strong> <br>
             Podría ser difícil de leer para algunos escáneres.</span>
          </div>

          <button class="generate-btn">Generar Código QR</button>
        </div>
      </div>

      <div class="qr-code">
        <div class="sync-status">Sincronizado</div>
        <div class="qr-image-container">
          <img src="" alt="Código QR">
        </div>
        <button class="download-btn">Descargar QR</button>
      </div>
    </div>

    <!-- SECCIÓN 2: DECODIFICADOR -->
    <div class="tab-content" id="decoder-section">
      <div class="panel-left decoder-panel">
        <header>
          <h2>Decodificador</h2>
          <p>Sube una imagen con QR para extraer su URL</p>
        </header>

        <div class="form">
          <div class="input-group">
            <label>Seleccionar Imagen:</label>
            <label class="file-drop-zone" id="dropZone">
              <span id="dropZoneText">Haz clic o arrastra un QR aquí</span>
              <input type="file" id="qrFileinput" accept="image/*" style="display: none;">
            </label>
          </div>

          <div class="input-group" id="resultContainer" style="display: none;">
            <label>Resultado Decodificado:</label>
            <div class="result-row">
              <input type="text" id="decodedResult" readonly placeholder="El texto o enlace aparecerá aquí..." />
              <button id="copyBtn" class="copy-icon-btn" title="Copiar al portapapeles">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
              </button>
            </div>
          </div>

          <button class="decode-action-btn" id="decodeBtn" style="display: none;">Decodificar QR</button>
        </div>
      </div>

      <div class="qr-code active-decoder-preview">
        <div class="sync-status" id="decodeStatus">Esperando imagen...</div>
        <div class="qr-image-container">
          <img id="previewUploadedImg" src="" alt="Preview QR" style="display: none;">
          <div id="placeholderPreview" style="font-size: 0.75rem; font-weight: 900; color: #94a3b8; text-transform: uppercase;">Sin archivo</div>
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
